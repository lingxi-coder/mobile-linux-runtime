[package]
name = "mobile-linux-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[lib]
name = "mobile_linux_runtime"
crate-type = ["lib", "staticlib", "cdylib"]
[dependencies]
mobile-linux-api = { path = "../mobile-linux-api" }
async-trait.workspace = true
uniffi.workspace = true
thiserror.workspace = true
tokio.workspace = true
[target.'cfg(target_os = "android")'.dependencies]
mobile-linux-android = { path = "../mobile-linux-android" }
[target.'cfg(target_os = "ios")'.dependencies]
mobile-linux-ios = { path = "../mobile-linux-ios" }
[lints]
workspace = true

[features]
bindgen = ["uniffi/cli"]
[[bin]]
name = "mobile-linux-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]
