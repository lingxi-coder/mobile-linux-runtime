# Build-only crate: NDK-compiles the vendored mksh + toybox C sources
# (third_party/{mksh,toybox}) into standalone ELF *executables* for Android
# targets, and emits their $OUT_DIR paths as `cargo:` metadata so the P5b/c
# packaging step can copy them into the APK as `lib*.so`. The lib.rs is empty;
# host builds are a no-op. No runtime deps — it only produces executables (so
# it does NOT use `cc::Build`/`links`, which would emit a static archive to
# link into Rust; build.rs drives the NDK clang directly).
#
# Licenses: toybox is 0BSD; mksh is MirOS (BSD-like). See third_party/{toybox,
# mksh} LICENSE/NOTICE and the OSS notices.
[package]
name = "platform-android-shellbin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lints]
workspace = true
